 b{display:block;padding-right:85px;font-size:13px}.item small{display:block;color:var(--m);font-size:11px;margin-top:4px}.badge{float:right;border-radius:18px;padding:5px 8px;font-size:9px;font-weight:800}.br{background:#ffe0e2;color:#c71c25}.bg{background:#daf6e9;color:#08774f}.menu{display:grid;grid-template-columns:1fr 1fr;gap:8px}.menu button{min-height:70px;text-align:left;padding:11px;border:1px solid var(--l);border-radius:12px;background:#fff}.menu span{font-size:20px}.menu b{display:block;margin-top:5px}.nav{position:fixed;bottom:0;width:430px;max-width:100%;height:68px;background:#fff;border-top:1px solid var(--l);display:flex;justify-content:space-around;padding-top:7px;z-index:20}.nav button{border:0;background:none;color:#697b8e;font-size:9px}.nav b{display:block;font-size:18px}.on{color:#0876d1!important;font-weight:800}.qr{text-align:center;border:2px dashed #8ca0b3;border-radius:14px;padding:17px}.qrmark{font-size:65px}.timeline{border-left:2px solid #cbd7e3;margin-left:9px;padding-left:17px}.event{margin-bottom:15px}.event b{font-size:12px}.event small{display:block;color:var(--m);margin-top:3px}.toast{display:none;position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#17324d;color:#fff;padding:11px 16px;border-radius:10px;font-size:12px;z-index:50}.modal{display:none;position:fixed;inset:0;background:#0007;z-index:40;align-items:flex-end}.modalbox{background:#fff;width:430px;max-width:100%;margin:auto;border-radius:20px 20px 0 0;padding:18px;max-height:88vh;overflow:auto}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
const SUPABASE_URL = 'https://bwgealrkpqibcpnjakku.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_cWgdH-AXOycnLfIbCRSjkQ_TrgiKKOq';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

let pts=[
{id:1,n:'VIBRADOR A13 FERRO LIGA CONV#A',ccm:'CCM#14',area:'C.C. LESTE 3',cub:'CUB.B05',type:'Motor/Vibrador',s:'blocked',reason:'Manutenção mecânica',resp:'João',time:'07/10/2026 08:32',obs:'Troca de rolamento'},
{id:2,n:'BOMBA B-12',ccm:'CCM#15',area:'C.C. LESTE 3',cub:'CUB.A02',type:'Bomba',s:'free'},
{id:3,n:'TRANSPORTADOR T-03',ccm:'CCM#16',area:'C.C. LESTE 3',cub:'CUB.C10',type:'Transportador',s:'free'},
{id:4,n:'VÁLVULA V-27',ccm:'CCM#14',area:'C.C. LESTE 3',cub:'CUB.B07',type:'Válvula',s:'free'},
{id:5,n:'EXAUSTOR E-08',ccm:'CCM#15',area:'C.C. LESTE 3',cub:'CUB.A11',type:'Exaustor',s:'blocked',reason:'Intervenção elétrica',resp:'Maria',time:'07/10/2026 09:15',obs:'Inspeção do circuito'},
{id:6,n:'VENTILADOR V-02',ccm:'CCM#16',area:'C.C. LESTE 3',cub:'CUB.C04',type:'Ventilador',s:'free'}];

let currentUser=null;
function displayName(user=currentUser){const meta=user?.user_metadata||{};return (meta.full_name||meta.name||meta.nome_completo||'').trim() || 'Usuário';}
const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
function requireAuth(){if(!currentUser){authDialog('Entre com sua conta autorizada para alterar equipamentos.');return false;}return true;}
function updateAuthButton(){const b=document.getElementById('authBtn');if(b)b.textContent=currentUser?'Sair':'Entrar';const small=document.querySelector('.hd small');if(small)small.textContent=currentUser?('Conectado: '+displayName()+' • LAB Ideias'):'Controle inteligente de bloqueios • LAB Ideias';}

async function authDialog(message=''){
  if(currentUser){const {error}=await supabaseClient.auth.signOut();if(error){toast('Não foi possível sair');return;}currentUser=null;updateAuthButton();toast('Sessão encerrada');home();return;}
  modal(`<h2>🔐 Acesso da equipe</h2><p class='sub'>Somente usuários autorizados podem alterar os registros.</p>${message?`<div class='card'>${esc(message)}</div>`:''}<label>E-mail corporativo</label><input id='loginEmail' type='email' autocomplete='username' placeholder='nome@empresa.com'><label>Senha</label><input id='loginPassword' type='password' autocomplete='current-password' placeholder='Sua senha'><button class='btn primary' onclick='loginUser()'>Entrar</button><button class='btn gray' onclick='closeM()'>Cancelar</button>`);
}
async function loginUser(){const email=document.getElementById('loginEmail').value.trim(),password=document.getElementById('loginPassword').value;if(!email||!password){toast('Informe e-mail e senha');return;}const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});if(error){toast('Login não realizado. Confira os dados.');return;}currentUser=data.user;updateAuthButton();closeM();toast('Acesso autorizado');home();}
supabaseClient.auth.getSession().then(({data})=>{currentUser=data.session?.user||null;updateAuthButton();});
supabaseClient.auth.onAuthStateChange((_event,session)=>{currentUser=session?.user||null;updateAuthButton();});

async function loadFromSupabase(){
  const {data, error}=await supabaseClient.from('equipamentos').select('*').order('id');
  if(error){ console.error(error); toast('Erro ao carregar dados do banco'); return; }
  if(data && data.length){
    pts=data.map(x=>({
      id:Number(x.id), n:x.nome, ccm:x.ccm||'', area:x.area||'', cub:x.cub||'',
      type:x.tipo||'Equipamento', s:x.status==='blocked'?'blocked':'free',
      reason:x.motivo||'', resp:x.responsavel||'', time:x.data_hora||'', obs:x.observacao||''
    }));
  } else {
    const seed=pts.map(x=>({
      id:x.id,nome:x.n,ccm:x.ccm,area:x.area,cub:x.cub,tipo:x.type,
      status:x.s,motivo:x.reason||null,responsavel:x.resp||null,data_hora:x.time||null,observacao:x.obs||null
    }));
    const ins=await supabaseClient.from('equipamentos').upsert(seed);
    if(ins.error) console.error(ins.error);
  }
  const h=await supabaseClient.from('historico').select('*').order('id',{ascending:false});
  if(!h.error && h.data?.length){
    logs=h.data.map(e=>{
      const p=pts.find(x=>x.id===Number(e.equipamento_id));
      return p?{id:e.id,a:e.acao,p,time:e.data_hora,user:e.responsavel||'Operador'}:null;
    }).filter(Boolean);
  } else {
    logs=pts.filter(x=>x.s==='blocked').map(x=>({a:'Bloqueio registrado',p:x,time:x.time,user:x.resp||'Operador'}));
  }
  dbReady=true;
  home();
  openLinkedEquipment();
}

async function saveEquipment(x){
  const row={id:x.id,nome:x.n,ccm:x.ccm,area:x.area,cub:x.cub,tipo:x.type,status:x.s,
    motivo:x.reason||null,responsavel:x.resp||null,data_hora:x.time||null,observacao:x.obs||null};
  const {error}=await supabaseClient.from('equipamentos').upsert(row);
  if(error){console.error(error);toast('Não foi possível salvar no banco');return false;}
  return true;
}

async function saveHistory(x, action, user){
  const {error}=await supabaseClient.from('historico').insert({
    equipamento_id:x.id,acao:action,responsavel:user||'Operador',usuario_id:currentUser?.id||null,
    data_hora:x.time||new Date().toISOString(),observacao:x.obs||null
  });
  if(error){console.error(error);return false;}
  return true;
}

async function refreshHistory(){
  const h=await supabaseClient.from('historico').select('*').order('id',{ascending:false});
  if(h.error){console.error(h.error);return;}
  logs=h.data.map(e=>{
    const p=pts.find(x=>x.id===Number(e.equipamento_id));
    return p?{id:e.id,a:e.acao,p,time:e.data_hora,user:e.responsavel||'Operador'}:null;
  }).filter(Boolean);
}

supabaseClient.channel('smartlock-live')
  .on('postgres_changes',{event:'*',schema:'public',table:'equipamentos'},payload=>{
    const r=payload.new;
    if(!r) return;
    const i=pts.findIndex(x=>x.id===Number(r.id));
    const x={id:Number(r.id),n:r.nome,ccm:r.ccm||'',area:r.area||'',cub:r.cub||'',type:r.tipo||'Equipamento',
      s:r.status==='blocked'?'blocked':'free',reason:r.motivo||'',resp:r.responsavel||'',time:r.data_hora||'',obs:r.observacao||''};
    if(i>=0) pts[i]=x; else pts.push(x);
    if(document.getElementById('n0').classList.contains('on')) home();
    else if(document.getElementById('n1').classList.contains('on')) filter();
    else if(document.getElementById('n3').classList.contains('on')) blocks();
    else if(document.getElementById('n4').classList.contains('on')) history();
  })
  .on('postgres_changes',{event:'*',schema:'public',table:'historico'},async ()=>{
    await refreshHistory();
    if(document.getElementById('n0').classList.contains('on')) home();
    else if(document.getElementById('n4').classList.contains('on')) history();
  })
  .subscribe();


const M=document.getElementById('main');function fmtDate(v){if(!v)return '—';const d=new Date(v);return Number.isNaN(d.getTime())?String(v):d.toLocaleString('pt-BR');}function nav(i){for(let j=0;j<5;j++)document.getElementById('n'+j).className=j===i?'on':''}function toast(x){let e=document.getElementById('toast');e.textContent=x;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}function head(a,b){return `<div class='title'>${a}</div><div class='sub'>${b}</div>`}function card(x){return `<div class='item' onclick='detail(${x.id})'><span class='badge ${x.s==='blocked'?'br':'bg'}'>${x.s==='blocked'?'🔴 BLOQUEADO':'🟢 LIVRE'}</span><b>${esc(x.n)}</b><small>${esc(x.ccm)} • ${esc(x.area)}</small><small>${esc(x.cub)} • ${esc(x.type)}</small></div>`}
function home(){nav(0);let b=pts.filter(x=>x.s==='blocked').length;M.innerHTML=head('Painel operacional','Visão geral do sistema')+`<div class='card hero'><b style='font-size:18px'>Controle de Bloqueios</b><p class='muted'>Consulte o ponto antes de iniciar qualquer intervenção.</p><button class='btn' style='background:#fff;color:#07518f' onclick='search()'>🔎 Fazer consulta</button></div><div class='grid2'><div class='k red'><b>${b}</b><small>Bloqueios ativos</small></div><div class='k green'><b>${pts.length-b}</b><small>Pontos livres</small></div></div><br><div class='grid3'><div class='k blue'><b>${pts.length}</b><small>Pontos</small></div><div class='k orange'><b>${logs.length}</b><small>Eventos</small></div><div class='k blue'><b>3</b><small>CCMs</small></div></div><div class='card'><b>Acesso rápido</b><div class='menu' style='margin-top:10px'><button onclick='qr()'><span>▦</span><b>Ler QR Code</b></button><button onclick='newPoint()'><span>➕</span><b>Cadastrar equipamento</b></button><button onclick='blocks()'><span>🔒</span><b>Bloqueios</b></button><button onclick='history()'><span>▤</span><b>Histórico</b></button></div></div><div class='card'><b>Últimos eventos</b>${logs.slice(0,3).map(x=>`<p style='font-size:11px;border-bottom:1px solid #eee;padding-bottom:8px'><b>${x.a}</b><br>${x.p.n}<br><span style='color:#6d7f91'>${x.time} • ${x.user}</span></p>`).join('')}</div>`}
function search(){nav(1);M.innerHTML=head('🔎 Pesquisa de pontos','Equipamento, CCM, CUB, área ou tipo')+`<div class='card'><input id='q' oninput='filter()' placeholder='Ex.: CCM#14, CUB.B05, Vibrador'><select id='sf' onchange='filter()'><option value=''>Todos os status</option><option value='free'>🟢 Livres</option><option value='blocked'>🔴 Bloqueados</option></select></div><div id='res'></div>`;filter()}function filter(){let q=(document.getElementById('q')?.value||'').toLowerCase(),s=document.getElementById('sf')?.value||'';let a=pts.filter(x=>(x.n+' '+x.ccm+' '+x.cub+' '+x.area+' '+x.type).toLowerCase().includes(q)&&(!s||x.s===s));document.getElementById('res').innerHTML=a.length?a.map(card).join(''):'<div class="card">Nenhum ponto encontrado.</div>'}
function detail(id){let x=pts.find(p=>p.id===id);M.innerHTML=head('Detalhes do ponto','Identificação e situação operacional')+`<div class='card'><span class='badge ${x.s==='blocked'?'br':'bg'}'>${x.s==='blocked'?'🔴 BLOQUEADO':'🟢 PONTO LIVRE'}</span><b>${esc(x.n)}</b><p class='sub'>${esc(x.ccm)} • ${esc(x.area)} • ${esc(x.cub)}</p><div class='grid2'><div><label>CCM</label><p>${x.ccm}</p></div><div><label>CUB</label><p>${x.cub}</p></div><div><label>Tipo</label><p>${x.type}</p></div><div><label>Status</label><p>${x.s}</p></div></div>${x.s==='blocked'?`<div class='card' style='background:#fff2f2'><b>Bloqueio ativo</b><p><b>Motivo:</b> ${esc(x.reason)}</p><p><b>Responsável:</b> ${esc(x.resp)}</p><p><b>Data/hora:</b> ${esc(fmtDate(x.time))}</p><p><b>Observação:</b> ${esc(x.obs)}</p></div>`:''}<button class='btn ${x.s==='blocked'?'success':'dark'}' onclick='${x.s==='blocked'?`endBlock(${x.id})`:`openBlock(${x.id})`}'>${x.s==='blocked'?'✅ Encerrar bloqueio':'🔒 Registrar bloqueio'}</button><button class='btn light' onclick='qrPoint(${x.id})'>▦ QR Code do ponto</button></div>`}
function blocks(){nav(3);let a=pts.filter(x=>x.s==='blocked');M.innerHTML=head('🔒 Bloqueios ativos','Gestão dos pontos atualmente bloqueados')+`<div class='card grid2'><div><b style='font-size:24px;color:#df3037'>${a.length}</b><small style='display:block'>Ativos</small></div><div><b style='font-size:24px;color:#08a66f'>${pts.length-a.length}</b><small style='display:block'>Livres</small></div></div>`+(a.length?a.map(card).join(''):'<div class="card">Nenhum bloqueio ativo.</div>')}
function openBlock(id){if(!requireAuth())return;let x=pts.find(p=>p.id===id);modal(`<h2>🔒 Registrar bloqueio</h2><p>${x.n}<br><span style='color:#6d7f91'>${x.ccm} • ${x.cub}</span></p><label>Motivo</label><select id='mot'><option>Manutenção mecânica</option><option>Intervenção elétrica</option><option>Segurança</option><option>Inspeção</option><option>Outro</option></select><label>Responsável</label><input id='resp' placeholder='Nome'><label>Observação</label><textarea id='obs' placeholder='Descrição da atividade'></textarea><button class='btn danger' onclick='saveBlock(${id})'>🔒 Confirmar bloqueio</button><button class='btn gray' onclick='closeM()'>Cancelar</button>`)}async function saveBlock(id){if(!requireAuth())return;const old=pts.find(p=>p.id===id);if(!old)return;const x={...old,s:'blocked',reason:document.getElementById('mot').value,resp:displayName(),obs:document.getElementById('obs').value,time:new Date().toISOString()};if(!(await saveEquipment(x)))return;Object.assign(old,x);const logged=await saveHistory(x,'Bloqueio registrado',displayName());await refreshHistory();closeM();toast(logged?'Bloqueio registrado e salvo':'Bloqueio salvo, mas houve falha no histórico');setTimeout(()=>detail(id),500)}
function endBlock(id){if(!requireAuth())return;let x=pts.find(p=>p.id===id);modal(`<h2>✅ Encerrar bloqueio</h2><p>Confirma a liberação?</p><b>${x.n}</b><p class='sub'>${x.ccm} • ${x.cub}</p><textarea id='eo' placeholder='Observação do encerramento'></textarea><button class='btn success' onclick='confirmEnd(${id})'>✅ Confirmar encerramento</button><button class='btn gray' onclick='closeM()'>Cancelar</button>`)}async function confirmEnd(id){if(!requireAuth())return;const old=pts.find(p=>p.id===id);if(!old)return;const x={...old,s:'free',obs:document.getElementById('eo').value||'Bloqueio encerrado',resp:displayName(),time:new Date().toISOString()};if(!(await saveEquipment(x)))return;Object.assign(old,x);const logged=await saveHistory(x,'Bloqueio encerrado',displayName());await refreshHistory();closeM();toast(logged?'Ponto liberado e salvo':'Ponto liberado, mas houve falha no histórico');setTimeout(()=>detail(id),500)}
function history(){nav(4);M.innerHTML=head('▤ Histórico','Rastreabilidade dos eventos')+`<div class='card'><input id='hq' oninput='hf()' placeholder='Pesquisar evento...'><select id='hs' onchange='hf()'><option value=''>Todos</option><option>Bloqueio registrado</option><option>Bloqueio encerrado</option></select></div><div id='hist'></div>`;hf()}function hf(){let q=(document.getElementById('hq')?.value||'').toLowerCase(),s=document.getElementById('hs')?.value||'';let a=logs.filter(x=>(x.p.n+' '+x.p.ccm+' '+x.p.cub).toLowerCase().includes(q)&&(!s||x.a===s));document.getElementById('hist').innerHTML=a.map(x=>`<div class='item'><span class='badge ${x.a==='Bloqueio encerrado'?'bg':'br'}'>${x.a==='Bloqueio encerrado'?'ENCERRADO':'BLOQUEIO'}</span><b>${esc(x.p.n)}</b><small>${esc(x.p.ccm)} • ${esc(x.p.cub)}</small><small>${esc(fmtDate(x.time))} • ${esc(x.user)}</small></div>`).join('')||'<div class="card">Nenhum evento.</div>'}
function qr(){nav(2);M.innerHTML=head('▦ QR Code','Gere um código real para consulta')+`<div class='card'><label>Escolha o equipamento</label><select id='qrSelect' onchange='renderSystemQR()'><option value=''>Selecione...</option>${pts.map(x=>`<option value='${x.id}'>${esc(x.n)} — ${esc(x.ccm)}</option>`).join('')}</select><div class='qr'><div id='qrCanvas' style='display:flex;justify-content:center;min-height:30px'></div><b id='qrLabel'>QR Code do equipamento</b><p class='sub'>O QR abre o endereço público do site diretamente no equipamento selecionado.</p><button class='btn primary' onclick='printQR()'>Imprimir QR Code</button></div></div>`;const id=new URLSearchParams(location.search).get('equipamento');if(id&&pts.some(x=>String(x.id)===id)){document.getElementById('qrSelect').value=id;renderSystemQR();} }
function renderSystemQR(){const id=document.getElementById('qrSelect')?.value,box=document.getElementById('qrCanvas'),label=document.getElementById('qrLabel');if(!box)return;box.innerHTML='';if(!id){label.textContent='QR Code do equipamento';return;}const x=pts.find(p=>String(p.id)===String(id));if(!x)return;label.textContent=x.n;const u=new URL(location.href);u.search='';u.hash='';u.searchParams.set('equipamento',x.id);if(window.QRCode){new QRCode(box,{text:u.toString(),width:190,height:190,correctLevel:QRCode.CorrectLevel.M});}else{box.textContent='Biblioteca de QR Code indisponível. Verifique sua conexão.';}}
function printQR(){if(!document.getElementById('qrCanvas')?.querySelector('canvas, img')){toast('Selecione um equipamento primeiro');return;}window.print();}
function qrPoint(id){nav(2);M.innerHTML=head('▦ QR Code do equipamento','Código para abrir a consulta do equipamento')+`<div class='card'><div class='qr'><div id='qrCanvas' style='display:flex;justify-content:center'></div><b id='qrLabel'></b><p class='sub'></p><button class='btn primary' onclick='printQR()'>Imprimir QR Code</button><button class='btn light' onclick='detail(${Number(id)})'>Voltar ao equipamento</button></div></div>`;const x=pts.find(p=>p.id===id);if(!x)return;document.getElementById('qrLabel').textContent=x.n;document.querySelector('.qr .sub').textContent=`${x.ccm} • ${x.cub}`;const u=new URL(location.href);u.search='';u.hash='';u.searchParams.set('equipamento',x.id);if(window.QRCode)new QRCode(document.getElementById('qrCanvas'),{text:u.toString(),width:190,height:190,correctLevel:QRCode.CorrectLevel.M});}
function openLinkedEquipment(){const id=new URLSearchParams(location.search).get('equipamento');if(id){const x=pts.find(p=>String(p.id)===id);if(x)detail(x.id);else toast('Equipamento do QR não encontrado');}}
function newPoint(){if(!requireAuth())return;modal(`<h2>➕ Cadastrar equipamento</h2><label>Equipamento</label><input id='nn' placeholder='Nome do equipamento'><label>CCM</label><input id='nc' placeholder='Ex.: CCM#14'><label>CUB</label><input id='nb' placeholder='Ex.: CUB.B05'><label>Área</label><input id='na' value='C.C. LESTE 3'><label>Tipo</label><input id='nt' placeholder='Ex.: Motor'><button class='btn dark' onclick='createPoint()'>➕ Cadastrar</button><button class='btn gray' onclick='closeM()'>Cancelar</button>`)}async function createPoint(){if(!requireAuth())return;const nome=document.getElementById('nn').value.trim();if(!nome){toast('Informe o nome do equipamento');return;}let x={id:Date.now(),n:nome,ccm:document.getElementById('nc').value.trim(),area:document.getElementById('na').value.trim(),cub:document.getElementById('nb').value.trim(),type:document.getElementById('nt').value.trim()||'Equipamento',s:'free'};if(!x.ccm){toast('Informe o CCM');return;}if(!(await saveEquipment(x)))return;pts.push(x);closeM();toast('Equipamento cadastrado e salvo');setTimeout(()=>detail(x.id),500)}function modal(x){document.getElementById('mb').innerHTML=x;document.getElementById('modal').style.display='flex'}function closeM(){document.getElementById('modal').style.display='none'}home();
loadFromSupabase();
</script></body></html>
