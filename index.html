async function loadFromSupabase(){
  const {data, error}=await supabaseClient.from('equipamentos').select('*').eq('archived',false).order('id');
  if(error){ console.error(error); toast('Erro ao carregar dados do banco'); return; }
  if(data && data.length){
    pts=data.map(x=>({
      id:Number(x.id), n:x.nome, ccm:x.ccm||'', area:x.area||'', cub:x.cub||'',
      type:x.tipo||'Equipamento', s:x.status==='blocked'?'blocked':'free',
      reason:x.motivo||'', resp:x.responsavel||'', time:x.data_hora||'', obs:x.observacao||''
    }));
  } else {
    const seed=pts.map(x=>({
      id:x.id,nome:x.n,ccm:x.ccm,area:x.area,cub:x.cub,tipo:x.type,
      status:x.s,motivo:x.reason||null,responsavel:x.resp||null,data_hora:x.time||null,observacao:x.obs||null
    }));
    const ins=await supabaseClient.from('equipamentos').upsert(seed);
    if(ins.error) console.error(ins.error);
  }
  const h=await supabaseClient.from('historico').select('*').order('id',{ascending:false});
  if(!h.error && h.data?.length){
    logs=h.data.map(e=>{
      const p=pts.find(x=>x.id===Number(e.equipamento_id));
      return p?{id:e.id,a:e.acao,p,time:e.data_hora,user:e.responsavel||'Operador'}:null;
    }).filter(Boolean);
  } else {
    logs=pts.filter(x=>x.s==='blocked').map(x=>({a:'Bloqueio registrado',p:x,time:x.time,user:x.resp||'Operador'}));
  }
  dbReady=true;
  home();
  openLinkedEquipment();
}

async function saveEquipment(x){
  const row={id:x.id,nome:x.n,ccm:x.ccm,area:x.area,cub:x.cub,tipo:x.type,status:x.s,
    motivo:x.reason||null,responsavel:x.resp||null,data_hora:x.time||null,observacao:x.obs||null};
  const {id,...updates}=row;
  const {error}=await supabaseClient.from('equipamentos').update(updates).eq('id',id);
  if(error){console.error(error);toast('Não foi possível salvar no banco');return false;}
  return true;
}

async function saveHistory(x, action, user){
  // A tabela public.historico não possui a coluna usuario_id.
  // Enviar apenas colunas existentes evita o erro 400/PGRST204.
  const {error}=await supabaseClient.from('historico').insert({
    equipamento_id:x.id,
    acao:action,
    responsavel:user||'Operador',
    data_hora:x.time||new Date().toISOString(),
    observacao:x.obs||null
  });
  if(error){console.error('Falha ao salvar histórico:',error);return false;}
  return true;
}

async function refreshHistory(){
  const h=await supabaseClient.from('historico').select('*').order('id',{ascending:false});
  if(h.error){console.error(h.error);return;}
  logs=h.data.map(e=>{
    const p=pts.find(x=>x.id===Number(e.equipamento_id));
    return p?{id:e.id,a:e.acao,p,time:e.data_hora,user:e.responsavel||'Operador'}:null;
  }).filter(Boolean);
}

supabaseClient.channel('smartlock-live')
  .on('postgres_changes',{event:'*',schema:'public',table:'equipamentos'},payload=>{
    const r=payload.new;
    if(!r) return;
    const i=pts.findIndex(x=>x.id===Number(r.id));
    if(r.archived===true){if(i>=0)pts.splice(i,1);if(document.getElementById('n0').classList.contains('on'))home();else if(document.getElementById('n3').classList.contains('on'))blocks();else if(document.getElementById('n4').classList.contains('on'))history();return;}
    const x={id:Number(r.id),n:r.nome,ccm:r.ccm||'',area:r.area||'',cub:r.cub||'',type:r.tipo||'Equipamento',
      s:r.status==='blocked'?'blocked':'free',reason:r.motivo||'',resp:r.responsavel||'',time:r.data_hora||'',obs:r.observacao||''};
    if(i>=0) pts[i]=x; else pts.push(x);
    if(document.getElementById('n0').classList.contains('on')) home();
    else if(document.getElementById('n1').classList.contains('on')) filter();
    else if(document.getElementById('n3').classList.contains('on')) blocks();
    else if(document.getElementById('n4').classList.contains('on')) history();
  })
  .on('postgres_changes',{event:'*',schema:'public',table:'historico'},async ()=>{
    await refreshHistory();
    if(document.getElementById('n0').classList.contains('on')) home();
    else if(document.getElementById('n4').classList.contains('on')) history();
  })
  .subscribe();

  `<div class='card hero'><b style='font-size:18px'>Controle de Bloqueios</b><p class='muted'>Consulte o ponto antes de iniciar qualquer intervenção.</p><button class='btn' style='background:#fff;color:#07518f' onclick='search()'>🔎 Fazer consulta</button></div>
  <div class='grid2'>
    <button class='k red' onclick='blocks()'><b>${blocked}</b><small>Bloqueios ativos · Ver lista</small></button>
    <button class='k green' onclick='freePoints()'><b>${free}</b><small>Pontos livres · Ver lista</small></button>
  </div><br>
  <div class='grid3'>
    <button class='k blue' onclick='search()'><b>${pts.length}</b><small>Pontos · Inspecionar</small></button>
    <button class='k orange' onclick='history()'><b>${logs.length}</b><small>Eventos · Histórico</small></button>
    <button class='k blue' onclick='ccms()'><b>${ccmCount}</b><small>CCMs · Ver lista</small></button>
  </div>
  <div class='card'><b>Acesso rápido</b><div class='menu' style='margin-top:10px'>
    <button onclick='qr()'><span>▦</span><b>Ler QR Code</b></button>
    ${isAdmin()?`<button onclick='newPoint()'><span>➕</span><b>Cadastrar equipamento</b></button>`:''}
    <button onclick='ccms()'><span>⚡</span><b>CCMs</b></button>
    <button onclick='blocks()'><span>🔒</span><b>Bloqueios ativos</b></button>
    <button onclick='freePoints()'><span>🟢</span><b>Pontos livres</b></button>
    <button onclick='history()'><span>▤</span><b>Histórico</b></button>
  </div></div>
  <div class='card'><b>Últimos eventos</b>${logs.slice(0,3).map(x=>`<p style='font-size:11px;border-bottom:1px solid #eee;padding-bottom:8px'><b>${esc(x.a)}</b><br>${esc(x.p.n)}<br><span style='color:#6d7f91'>${esc(fmtDate(x.time))} • ${esc(x.user)}</span></p>`).join('')}</div>`;
  if(isAdmin()) M.insertAdjacentHTML('afterbegin',`<button id='inviteAdminBtn' class='btn light' onclick='inviteDialog()'>🔑 Gerar convite individual</button><button class='btn light' onclick='adminUsers()'>👥 Gerenciar usuários</button>`);
}
function search(){nav(1);M.innerHTML=head('🔎 Pesquisa de pontos','Equipamento, CCM, CUB, área ou tipo')+`<div class='card'><input id='q' oninput='filter()' placeholder='Ex.: CCM#14, CUB.B05, Vibrador'><select id='sf' onchange='filter()'><option value=''>Todos os status</option><option value='free'>🟢 Livres</option><option value='blocked'>🔴 Bloqueados</option></select></div><div id='res'></div>`;filter()}
function filter(){
  const result=document.getElementById('res');
  // Realtime pode disparar quando a tela de pesquisa não está aberta.
  if(!result)return;
  const q=(document.getElementById('q')?.value||'').toLowerCase();
  const s=document.getElementById('sf')?.value||'';
  const a=pts.filter(x=>(x.n+' '+x.ccm+' '+x.cub+' '+x.area+' '+x.type).toLowerCase().includes(q)&&(!s||x.s===s));
  result.innerHTML=a.length?a.map(card).join(''):'<div class="card">Nenhum ponto encontrado.</div>';
}
function ccms(){
  nav(0);
  const names=[...new Set(pts.map(x=>String(x.ccm||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR',{numeric:true,sensitivity:'base'}));
  M.innerHTML=head('⚡ CCMs','Selecione um CCM para ver somente os equipamentos cadastrados nele')+
    (names.length?names.map(name=>{
      const items=pts.filter(x=>String(x.ccm||'').trim()===name);
      const blocked=items.filter(x=>x.s==='blocked').length;
      return `<div class='item' onclick='ccmDetails(${JSON.stringify(name)})'><span class='badge ${blocked?'br':'bg'}'>${blocked} bloqueado(s)</span><b>${esc(name)}</b><small>${items.length} equipamento(s) • ${items.length-blocked} livre(s)</small></div>`;
    }).join(''):'<div class="card">Ainda não há CCMs cadastrados.</div>')+
    `<button class='btn gray' onclick='home()'>Voltar ao início</button>`;
}
function ccmDetails(name){
  const items=pts.filter(x=>String(x.ccm||'').trim()===String(name).trim());
  const blocked=items.filter(x=>x.s==='blocked').length;
  M.innerHTML=head('⚡ '+esc(name),'Somente equipamentos cadastrados neste CCM')+
    `<div class='card grid2'><div><b style='font-size:22px;color:#df3037'>${blocked}</b><small style='display:block'>Bloqueados</small></div><div><b style='font-size:22px;color:#08a66f'>${items.length-blocked}</b><small style='display:block'>Livres</small></div></div>`+
    (items.length?items.map(card).join(''):'<div class="card">Nenhum equipamento cadastrado neste CCM.</div>')+
    `<button class='btn light' onclick='ccms()'>Voltar à lista de CCMs</button>`;
}
function detail(id){let x=pts.find(p=>p.id===id);M.innerHTML=head('Detalhes do ponto','Identificação e situação operacional')+`<div class='card'><span class='badge ${x.s==='blocked'?'br':'bg'}'>${x.s==='blocked'?'🔴 BLOQUEADO':'🟢 PONTO LIVRE'}</span><b>${esc(x.n)}</b><p class='sub'>${esc(x.ccm)} • ${esc(x.area)} • ${esc(x.cub)}</p><div class='grid2'><div><label>CCM</label><p>${x.ccm}</p></div><div><label>CUB</label><p>${x.cub}</p></div><div><label>Tipo</label><p>${x.type}</p></div><div><label>Status</label><p>${x.s}</p></div></div>${x.s==='blocked'?`<div class='card' style='background:#fff2f2'><b>Bloqueio ativo</b><p><b>Motivo:</b> ${esc(x.reason)}</p><p><b>Responsável:</b> ${esc(x.resp)}</p><p><b>Data/hora:</b> ${esc(fmtDate(x.time))}</p><p><b>Observação:</b> ${esc(x.obs)}</p></div>`:''}<button class='btn ${x.s==='blocked'?'success':'dark'}' onclick='${x.s==='blocked'?`endBlock(${x.id})`:`openBlock(${x.id})`}'>${x.s==='blocked'?'✅ Encerrar bloqueio':'🔒 Registrar bloqueio'}</button><button class='btn light' onclick='qrPoint(${x.id})'>▦ QR Code do ponto</button>${isAdmin()?`<button class='btn danger' onclick='archiveEquipment(${x.id})'>Remover equipamento (ADM)</button>`:''}</div>`}
function statusTabs(active){return `<div class='grid2' style='margin-bottom:12px'><button class='btn ${active==='blocked'?'danger':'light'}' onclick='blocks()'>🔒 Bloqueados</button><button class='btn ${active==='free'?'success':'light'}' onclick='freePoints()'>🟢 Livres</button></div>`}
function blocks(){nav(3);let a=pts.filter(x=>x.s==='blocked');M.innerHTML=head('🔒 Bloqueios ativos','Equipamentos atualmente bloqueados')+statusTabs('blocked')+`<div class='card grid2'><div><b style='font-size:24px;color:#df3037'>${a.length}</b><small style='display:block'>Bloqueados</small></div><div><b style='font-size:24px;color:#08a66f'>${pts.length-a.length}</b><small style='display:block'>Livres</small></div></div>`+(a.length?a.map(card).join(''):'<div class="card">Nenhum bloqueio ativo.</div>')}
function freePoints(){nav(3);let a=pts.filter(x=>x.s==='free');M.innerHTML=head('🟢 Equipamentos livres','Pontos atualmente sem bloqueio registrado')+statusTabs('free')+`<div class='card grid2'><div><b style='font-size:24px;color:#08a66f'>${a.length}</b><small style='display:block'>Livres</small></div><div><b style='font-size:24px;color:#df3037'>${pts.length-a.length}</b><small style='display:block'>Bloqueados</small></div></div>`+(a.length?a.map(card).join(''):'<div class="card">Nenhum equipamento livre encontrado.</div>')}
function openBlock(id){if(!requireAuth())return;let x=pts.find(p=>p.id===id);modal(`<h2>🔒 Registrar bloqueio</h2><p>${x.n}<br><span style='color:#6d7f91'>${x.ccm} • ${x.cub}</span></p><label>Motivo</label><select id='mot'><option>Manutenção mecânica</option><option>Intervenção elétrica</option><option>Segurança</option><option>Inspeção</option><option>Outro</option></select><label>Responsável</label><input id='resp' placeholder='Nome'><label>Observação</label><textarea id='obs' placeholder='Descrição da atividade'></textarea><button class='btn danger' onclick='saveBlock(${id})'>🔒 Confirmar bloqueio</button><button class='btn gray' onclick='closeM()'>Cancelar</button>`)}async function saveBlock(id){if(!requireAuth())return;const old=pts.find(p=>p.id===id);if(!old)return;const x={...old,s:'blocked',reason:document.getElementById('mot').value,resp:displayName(),obs:document.getElementById('obs').value,time:new Date().toISOString()};if(!(await saveEquipment(x)))return;Object.assign(old,x);const logged=await saveHistory(x,'Bloqueio registrado',displayName());await refreshHistory();closeM();toast(logged?'Bloqueio registrado e salvo':'Bloqueio salvo, mas houve falha no histórico');setTimeout(()=>detail(id),500)}
function endBlock(id){if(!requireAuth())return;let x=pts.find(p=>p.id===id);modal(`<h2>✅ Encerrar bloqueio</h2><p>Confirma a liberação?</p><b>${x.n}</b><p class='sub'>${x.ccm} • ${x.cub}</p><textarea id='eo' placeholder='Observação do encerramento'></textarea><button class='btn success' onclick='confirmEnd(${id})'>✅ Confirmar encerramento</button><button class='btn gray' onclick='closeM()'>Cancelar</button>`)}async function confirmEnd(id){if(!requireAuth())return;const old=pts.find(p=>p.id===id);if(!old)return;const x={...old,s:'free',obs:document.getElementById('eo').value||'Bloqueio encerrado',resp:displayName(),time:new Date().toISOString()};if(!(await saveEquipment(x)))return;Object.assign(old,x);const logged=await saveHistory(x,'Bloqueio encerrado',displayName());await refreshHistory();closeM();toast(logged?'Ponto liberado e salvo':'Ponto liberado, mas houve falha no histórico');setTimeout(()=>detail(id),500)}
function history(){nav(4);M.innerHTML=head('▤ Histórico','Consulte os eventos por dia ou período')+`<div class='card'><label>Dia específico</label><input id='hd' type='date' onchange='hf()'><div class='grid2'><div><label>De</label><input id='hfrom' type='date' onchange='hf()'></div><div><label>Até</label><input id='hto' type='date' onchange='hf()'></div></div><button class='btn light' onclick='clearHistoryDates()'>Limpar datas</button><label>Pesquisar equipamento</label><input id='hq' oninput='hf()' placeholder='Nome, CCM ou CUB'><label>Tipo de evento</label><select id='hs' onchange='hf()'><option value=''>Todos os eventos</option><option>Bloqueio registrado</option><option>Bloqueio encerrado</option></select></div><div id='hist'></div>`;hf()}
function clearHistoryDates(){for(const id of ['hd','hfrom','hto']){const e=document.getElementById(id);if(e)e.value='';}hf()}
function historyDateKey(value){
  if(!value)return '';
  const raw=String(value);
  // Compatibility with older sample values such as 07/10/2026 08:32.
  const br=raw.match(/^(\d{2})\/(\d{2})\/(\d{4})/);
  if(br)return `${br[3]}-${br[2]}-${br[1]}`;
  const d=new Date(value);
  if(Number.isNaN(d.getTime()))return '';
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function hf(){
  const hist=document.getElementById('hist');
  // Não tente atualizar a tela de histórico se ela não estiver montada.
  if(!hist)return;
  const q=(document.getElementById('hq')?.value||'').toLowerCase();
  const s=document.getElementById('hs')?.value||'';
  const day=document.getElementById('hd')?.value||'';
  const from=document.getElementById('hfrom')?.value||'';
  const to=document.getElementById('hto')?.value||'';
  const a=logs.filter(x=>{
    const text=(x.p.n+' '+x.p.ccm+' '+x.p.cub).toLowerCase();
    const d=historyDateKey(x.time);
    const dateOK=day ? d===day : ((!from||d>=from)&&(!to||d<=to));
    return text.includes(q)&&(!s||x.a===s)&&dateOK;
  });
  hist.innerHTML=a.map(x=>`<div class='item'><span class='badge ${x.a==='Bloqueio encerrado'?'bg':'br'}'>${x.a==='Bloqueio encerrado'?'ENCERRADO':'BLOQUEIO'}</span><b>${esc(x.p.n)}</b><small>${esc(x.p.ccm)} • ${esc(x.p.cub)}</small><small>${esc(fmtDate(x.time))} • ${esc(x.user)}</small></div>`).join('')||'<div class="card">Nenhum evento.</div>';
}
function qr(){nav(2);M.innerHTML=head('▦ QR Code','Gere um código real para consulta')+`<div class='card'><label>Escolha o equipamento</label><select id='qrSelect' onchange='renderSystemQR()'><option value=''>Selecione...</option>${pts.map(x=>`<option value='${x.id}'>${esc(x.n)} — ${esc(x.ccm)}</option>`).join('')}</select><div class='qr'><div id='qrCanvas' style='display:flex;justify-content:center;min-height:30px'></div><b id='qrLabel'>QR Code do equipamento</b><p class='sub'>O QR abre o endereço público do site diretamente no equipamento selecionado.</p><button class='btn primary' onclick='printQR()'>Imprimir QR Code</button></div></div>`;const id=new URLSearchParams(location.search).get('equipamento');if(id&&pts.some(x=>String(x.id)===id)){document.getElementById('qrSelect').value=id;renderSystemQR();} }
function renderSystemQR(){const id=document.getElementById('qrSelect')?.value,box=document.getElementById('qrCanvas'),label=document.getElementById('qrLabel');if(!box)return;box.innerHTML='';if(!id){label.textContent='QR Code do equipamento';return;}const x=pts.find(p=>String(p.id)===String(id));if(!x)return;label.textContent=x.n;const u=new URL(location.href);u.search='';u.hash='';u.searchParams.set('equipamento',x.id);if(window.QRCode){new QRCode(box,{text:u.toString(),width:190,height:190,correctLevel:QRCode.CorrectLevel.M});}else{box.textContent='Biblioteca de QR Code indisponível. Verifique sua conexão.';}}
function printQR(){if(!document.getElementById('qrCanvas')?.querySelector('canvas, img')){toast('Selecione um equipamento primeiro');return;}window.print();}
function qrPoint(id){nav(2);M.innerHTML=head('▦ QR Code do equipamento','Código para abrir a consulta do equipamento')+`<div class='card'><div class='qr'><div id='qrCanvas' style='display:flex;justify-content:center'></div><b id='qrLabel'></b><p class='sub'></p><button class='btn primary' onclick='printQR()'>Imprimir QR Code</button><button class='btn light' onclick='detail(${Number(id)})'>Voltar ao equipamento</button></div></div>`;const x=pts.find(p=>p.id===id);if(!x)return;document.getElementById('qrLabel').textContent=x.n;document.querySelector('.qr .sub').textContent=`${x.ccm} • ${x.cub}`;const u=new URL(location.href);u.search='';u.hash='';u.searchParams.set('equipamento',x.id);if(window.QRCode)new QRCode(document.getElementById('qrCanvas'),{text:u.toString(),width:190,height:190,correctLevel:QRCode.CorrectLevel.M});}
function openLinkedEquipment(){const id=new URLSearchParams(location.search).get('equipamento');if(id){const x=pts.find(p=>String(p.id)===id);if(x)detail(x.id);else toast('Equipamento do QR não encontrado');}}
function newPoint(){
  if(!isAdmin()){toast('Somente o administrador pode cadastrar equipamentos.');return;}
  modal(`<h2>➕ Cadastrar equipamento</h2><label>Equipamento</label><input id='nn' placeholder='Nome do equipamento'><label>CCM</label><input id='nc' placeholder='Ex.: CCM#14'><label>CUB</label><input id='nb' placeholder='Ex.: CUB.B05'><label>Área</label><input id='na' placeholder='Ex.: C.C. LESTE 3'><label>Tipo</label><input id='nt' placeholder='Ex.: Motor'><button class='btn dark' onclick='createPoint()'>➕ Cadastrar</button><button class='btn gray' onclick='closeM()'>Cancelar</button>`);
}
async function createPoint(){
  if(!isAdmin()){toast('Somente o administrador pode cadastrar equipamentos.');return;}
  const nome=document.getElementById('nn')?.value.trim()||'';
  const ccm=document.getElementById('nc')?.value.trim()||'';
  if(!nome){toast('Informe o nome do equipamento');return;}
  if(!ccm){toast('Informe o CCM');return;}
  const payload={nome,ccm,area:document.getElementById('na')?.value.trim()||'',cub:document.getElementById('nb')?.value.trim()||'',tipo:document.getElementById('nt')?.value.trim()||'Equipamento'};
  const btn=document.querySelector('#mb button.dark');if(btn){btn.disabled=true;btn.textContent='Cadastrando...';}
  try{
    const result=await adminRequest('create_equipment',payload);
    const row=result.equipment;
    const x={id:Number(row.id),n:row.nome,ccm:row.ccm||'',area:row.area||'',cub:row.cub||'',type:row.tipo||'Equipamento',s:row.status==='blocked'?'blocked':'free',reason:row.motivo||'',resp:row.responsavel||'',time:row.data_hora||'',obs:row.observacao||''};
    const i=pts.findIndex(p=>p.id===x.id);if(i>=0)pts[i]=x;else pts.push(x);
    closeM();toast('Equipamento cadastrado e salvo');setTimeout(()=>detail(x.id),300);
  }catch(e){toast(e.message||'Não foi possível cadastrar equipamento.');if(btn){btn.disabled=false;btn.textContent='➕ Cadastrar';}}
}function modal(x){document.getElementById('mb').innerHTML=x;document.getElementById('modal').style.display='flex'}function closeM(){document.getElementById('modal').style.display='none'}home();
loadFromSupabase();
</script></body></html>
